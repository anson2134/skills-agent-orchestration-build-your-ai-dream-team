<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">Team overview</p>
        <h1>Project Pulse</h1>
        <p class="subtitle">A clear view of momentum across your active projects.</p>
      </div>
      <div class="pulse-summary" aria-label="Project summary">
        <span id="project-count">Loading projects...</span>
      </div>
    </header>

    <section aria-labelledby="projects-heading">
      <div class="section-heading">
        <h2 id="projects-heading">Current projects</h2>
        <span class="section-rule" aria-hidden="true"></span>
      </div>
      <div id="project-list" class="project-grid" aria-live="polite">
        <p class="loading-message">Loading project pulse...</p>
      </div>
    </section>
  </main>

  <script>
    const projectList = document.querySelector("#project-list");
    const projectCount = document.querySelector("#project-count");

    function createProjectCard(project) {
      const card = document.createElement("article");
      card.className = "project-card";

      const name = document.createElement("h3");
      name.textContent = project.name;

      const owner = document.createElement("p");
      owner.className = "project-owner";
      owner.textContent = `Owned by ${project.owner}`;

      const status = document.createElement("p");
      status.className = "project-status";
      status.textContent = `Status: ${project.status}`;

      const activity = document.createElement("p");
      activity.className = "project-activity";
      activity.textContent = `Recent activity: ${project.recentActivity}`;

      const priority = document.createElement("p");
      priority.className = "project-priority";
      priority.textContent = `Priority: ${project.priority}`;

      card.append(name, owner, status, activity, priority);
      return card;
    }

    fetch("project-data.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Project data request failed: ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data.projects)) {
          throw new Error("Project data must contain a projects array.");
        }

        projectCount.textContent = `${data.projects.length} projects`;
        projectList.replaceChildren(...data.projects.map(createProjectCard));
      })
      .catch((error) => {
        projectCount.textContent = "Unavailable";
        projectList.replaceChildren(
          Object.assign(document.createElement("p"), {
            className: "error-message",
            textContent: `Unable to load project data: ${error.message}`
          })
        );
      });
  </script>
</body>
</html>
